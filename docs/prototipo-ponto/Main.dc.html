<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0a160d; color: #e7efe8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 700">Carlos Souza</span>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #fbbf24">OPERADOR</span>
      </div>
    </div>
    <button type="button" aria-label="Sair" style="width: 44px; height: 44px; border-radius: 12px; background: #142718; border: 1px solid #234129; color: #9fb8a5; display: flex; align-items: center; justify-content: center; cursor: pointer">

    </button>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 16px">

    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; color: #fef3c7">Ponto</h1>
      <span style="font-size: 13px; font-weight: 600; color: #9fb8a5">qui, 5 de novembro</span>
    </div>

    <section aria-label="Situação agora" style="background: #142718; border: 1px solid #234129; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.35); color: #86efac; font-size: 13px; font-weight: 700">
          <span style="width: 8px; height: 8px; border-radius: 999px; background: #4ade80"></span>
          Em expediente
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #9fb8a5">desde 08:02</span>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #9fb8a5">TRABALHADO HOJE</span>
          <span style="font-size: 44px; line-height: 1; font-weight: 800; color: #fef3c7; font-variant-numeric: tabular-nums">3h 18</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #9fb8a5">HORA OFICIAL</span>
          <span style="font-size: 20px; font-weight: 700; color: #e7efe8; font-variant-numeric: tabular-nums">11:20:14</span>
        </div>
      </div>

      <ol aria-label="Marcações de hoje" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; background: rgba(74,222,128,0.10); border: 1px solid rgba(74,222,128,0.30)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span style="font-size: 11px; font-weight: 700; color: #9fb8a5">Entrada</span>
          <span style="font-size: 15px; font-weight: 800; color: #e7efe8; font-variant-numeric: tabular-nums">08:02</span>
        </li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; background: rgba(245,158,11,0.12); border: 1.5px solid #f59e0b">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span style="font-size: 11px; font-weight: 700; color: #fbbf24">Intervalo</span>
          <span style="font-size: 15px; font-weight: 800; color: #fbbf24">agora</span>
        </li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; background: #0f1f12; border: 1px dashed #2c4a32">

          <span style="font-size: 11px; font-weight: 700; color: #9fb8a5">Retorno</span>
          <span style="font-size: 15px; font-weight: 800; color: #5f7d66">--:--</span>
        </li>
        <li style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; background: #0f1f12; border: 1px dashed #2c4a32">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f7d66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
          <span style="font-size: 11px; font-weight: 700; color: #9fb8a5">Saída</span>
          <span style="font-size: 15px; font-weight: 800; color: #5f7d66">--:--</span>
        </li>
      </ol>
    </section>

    <button type="button" style="width: 100%; min-height: 96px; border: 0; border-radius: 24px; background: linear-gradient(180deg, #fbbf24, #f59e0b); color: #1a1205; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; box-shadow: 0 10px 30px rgba(245,158,11,0.25)">
      <span style="display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: 0.01em">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2"/><path d="M10 2v2"/><path d="M14 2v2"/></svg>
        Iniciar intervalo
      </span>
      <span style="font-size: 13px; font-weight: 600; color: #5a3d06">Toque uma vez · registra 11:20</span>
    </button>

    <div style="display: flex; justify-content: center">
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 700; color: #9fb8a5; text-decoration: underline; text-underline-offset: 4px">Esqueci de marcar</a>
    </div>
  </main>

  <nav aria-label="Navegação" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #1b321f; background: #0d1c10; padding: 6px 4px 10px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #8aa592; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.48 12.89 17 22l-5-3-5 3 1.52-9.11"/></svg>Marcas</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #8aa592; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5c-1 0-1.44.5-3 .5s-2-.5-3-.5-1.72.5-2.5.5a2.5 2.5 0 0 1 0-5c.78 0 1.57.5 2.5.5S9.44 2 11 2s2 1.5 3 1.5 1.72-.5 2.5-.5a2.5 2.5 0 0 1 0 5c-.78 0-1.5-.5-2.5-.5Z"/><path d="M5 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/></svg>Sabores</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #8aa592; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>Preços</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #fbbf24; text-decoration: none; font-size: 11px; font-weight: 800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Ponto</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #8aa592; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>Mais</a>
  </nav>
</div>
